version: "3.8"

services:
  qwen3-asr-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: qwen3-asr-server:latest
    container_name: qwen3-asr-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=Qwen/Qwen3-ASR-0.6B
      - DEVICE=cuda
      - TORCH_DTYPE=bfloat16
      - PORT=8000
    volumes:
      # Mount cache so weights are not re-downloaded on container restart
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache:
    name: qwen3_asr_hf_cache
